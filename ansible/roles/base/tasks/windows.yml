---
# Microsoft Windows specific tasks.

# Tasks for updating the operating system and installing additional packages.
- name: Getting guest operating system information.
  ansible.builtin.debug:
    msg: "OS: {{ ansible_facts['os_name'] }}"

- name: Ensure .NET Framework 4.8 requirement is satisfied for Chocolatey v2.0.0 and later.
  when: ansible_facts['os_installation_type'] != "Server Core"
  block:
    - name: Install Chocolatey CLI
      chocolatey.chocolatey.win_chocolatey:
        name: chocolatey
        state: present
        version: 1.4.0

    - name: Install Microsoft .NET Framework 4.8.
      chocolatey.chocolatey.win_chocolatey:
        name: netfx-4.8
        state: present

    - name: Reboot the host to complete .NET Framework 4.8 install.
      ansible.windows.win_reboot:

    - name: Install latest version of Chocolatey.
      chocolatey.chocolatey.win_chocolatey:
        name: chocolatey
        state: latest

    # Chocolatey itself is installed above, but the base image deliberately ships no
    # packages on top of it. This used to install googlechrome, putty, winscp and 7zip,
    # and a single dropped connection to dl.google.com was enough to fail an entire
    # image build. Anything that needs an application installs it itself --
    # scripts/windows/sds-apps.ps1 already does exactly that for the SDS image.

- name: Updating the operating system.
  ansible.windows.win_updates:
    category_names:
      - SecurityUpdates
      - CriticalUpdates
    reject_list:
      - 5034439
      - 5034441
    reboot: true
  register: win_updates
  until: not win_updates.failed
  retries: 5
  delay: 300
