---
# Installs Packer, Terraform, Ansible, and the supporting tools needed to work with this repo.
# Ubuntu/Debian only -- this role is wired into ansible/linux-packer-playbook.yml, which only
# ever runs against the Ubuntu-based packer build. The install steps mirror
# docs/getting-started/requirements.md (Ubuntu tab) so this box matches what the docs tell a human
# to do by hand.

- name: "{{ devtools_task_name }}"
  ansible.builtin.debug:
    msg: "{{ devtools_task_name }}"

# HashiCorp apt repository (Packer, Terraform).

- name: Install prerequisite packages for adding apt repositories
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - software-properties-common
    state: present
    update_cache: true

- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add the HashiCorp apt GPG key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor > /etc/apt/keyrings/hashicorp-archive-keyring.gpg
  args:
    creates: /etc/apt/keyrings/hashicorp-archive-keyring.gpg
    executable: /bin/bash

- name: Add the HashiCorp apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com {{ ansible_facts['lsb']['codename'] }} main"
    filename: hashicorp
    state: present

# Ansible PPA -- Ubuntu's own repos lag the ansible-core >= 2.16 this project requires.

- name: Add the Ansible PPA
  ansible.builtin.apt_repository:
    repo: ppa:ansible/ansible
    state: present

# GitHub CLI apt repository.

- name: Add the GitHub CLI apt GPG key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg > /etc/apt/keyrings/githubcli-archive-keyring.gpg
  args:
    creates: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    executable: /bin/bash

- name: Add the GitHub CLI apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present

# Docker apt repository.

- name: Add the Docker apt GPG key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor > /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
    executable: /bin/bash

- name: Add the Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_facts['lsb']['codename'] }} stable"
    filename: docker
    state: present

# Install everything from the repos added above, plus this project's other required packages
# (git, jq, xorriso, unzip, whois, python3-pip -- see docs/getting-started/requirements.md).

- name: Install Packer, Terraform, Ansible, gh, Docker, and this repo's other required packages
  ansible.builtin.apt:
    name:
      - ansible
      - packer
      - terraform
      - gh
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - git
      - jq
      - xorriso
      - unzip
      - whois
      - python3-pip
    state: present
    update_cache: true

- name: Add the build user to the docker group
  ansible.builtin.user:
    name: "{{ build_username }}"
    groups: docker
    append: true

# Tools distributed only as GitHub release binaries, not via an apt repository.

- name: Install gomplate
  ansible.builtin.get_url:
    url: "https://github.com/hairyhenderson/gomplate/releases/download/v{{ devtools_gomplate_version }}/gomplate_linux-amd64"
    dest: /usr/local/bin/gomplate
    mode: "0755"

- name: Install yq
  ansible.builtin.get_url:
    url: https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
    dest: /usr/local/bin/yq
    mode: "0755"

- name: Install govc (vSphere CLI)
  ansible.builtin.unarchive:
    src: https://github.com/vmware/govmomi/releases/latest/download/govc_Linux_x86_64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include:
      - govc
    mode: "0755"
