---
- name: Playbook for Linux
  become: true
  become_method: ansible.builtin.sudo
  debugger: never
  gather_facts: true
  hosts: all
  vars:
    enable_cloudinit: false
    # Pin the unversioned symlink. Discovery would cache a versioned path
    # (/usr/bin/python3.11 on Photon 5), and the OS update task later in this
    # play replaces Python, leaving every subsequent module calling a binary
    # that no longer exists. The package manager repoints this symlink.
    ansible_python_interpreter: /usr/bin/python3
  roles:
    - base
    - users
    - configure
    - clean
